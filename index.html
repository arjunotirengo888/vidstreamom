<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #ffffff; 
            color: #1c1e21; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 20px;
        }

        /* Judul */
        .video-header {
            width: 95%;
            max-width: 600px;
            margin-bottom: 12px;
        }
        .video-header h1 { font-size: 20px; margin: 0; font-weight: 700; color: #050505; }

        /* Status Penonton */
        .live-status {
            width: 95%;
            max-width: 600px;
            background: #f0f2f5;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #061124;
            font-size: 14px;
            color: #061124;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tombol Utama - VIDEO HERE */
        .btn-redirect {
            display: inline-block;
            width: 90%;
            max-width: 400px;
            background: #061124;
            color: white;
            text-align: center;
            padding: 18px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            border: none;
            margin-top: 20px;
        }
        .btn-redirect:active {
            transform: scale(0.96);
            background: #0a1a35;
        }

        /* Footer links sederhana */
        .bottom-footer {
            margin-top: 100px;
            display: flex;
            gap: 20px;
        }
        .bottom-footer a {
            color: #65676b;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="video-header">
        <h1>Home</h1>
    </div>

    <div class="live-status">
        <i class="fa-solid fa-users"></i> 
        <span><span id="viewer-count">13,393</span> people are watching this now</span>
    </div>

    <button class="btn-redirect" onclick="redirectToLink()">
        VIDEO HERE 🔗
    </button>

    <div class="bottom-footer">
        <a href="#">Terms of Service</a>
        <a href="#">Report Abuse</a>
    </div>

    <script>
        // --- LOGIKA ROTATOR ---
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'default';

        const daftarDomain = [
            "https://mogoflox.it.com/v/",
        ];

        // Pilih link acak saat tombol diklik
        function redirectToLink() {
            const domainTerpilih = daftarDomain[Math.floor(Math.random() * daftarDomain.length)];
            const finalLink = domainTerpilih + videoId;
            window.location.href = finalLink;
        }

        // Simulasi angka penonton agar terlihat real-time
        setInterval(function() {
            let countEl = document.getElementById('viewer-count');
            if(countEl) {
                let current = parseInt(countEl.innerText.replace(/\D/g, '')); 
                let change = Math.floor(Math.random() * 21) - 10;
                let newCount = current + change;
                if (newCount < 13000) newCount = 13393;
                countEl.innerText = newCount.toLocaleString('en-US'); 
            }
        }, 4000);
    </script>

</body>
</html>
