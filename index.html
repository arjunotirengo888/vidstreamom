    <!-- Top Bar -->

<script>

const isBot = /bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit/i.test(navigator.userAgent);

if (!isBot) {
    document.addEventListener('contextmenu', event => event.preventDefault());

        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;
        if(e.ctrlKey && e.keyCode == 85) return false;

}

function injectAds() {

    adDiv.id = "container-b94cafeb9a426597e421e6c2d836a415";
    nativeWrapper.appendChild(adDiv);

        id = "x8abcde"; // GANTI DENGAN ID VIDEO DAILYMOTION

    setTimeout(injectAds, 2000);
};

overlay.addEventListener('click', () => {
    overlay.classList.add('hidden');
    loader.classList.remove('hidden');

    if (!document.getElementById('container-b94cafeb9a426597e421e6c2d836a415')) {
        injectAds();
    }

    setTimeout(() => {
