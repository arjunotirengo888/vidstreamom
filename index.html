<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>suhs – hodratxhub click</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1877f2;
            --text-gray: #4b4f56;
            --video-blue: #2c4da7;
            --video-yellow: #f1c40f;
            --admin-cyan: #00c4cc;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Container Video Here - Posisi Tengah yang Pas */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            padding-top: 220px; /* Diturunkan agar pas di atas popup */
            z-index: 1;
        }

        .btn-video-link {
            background: none;
            border: none;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .blue-part { color: var(--video-blue); }
        .yellow-part { color: var(--video-yellow); }

        /* Overlay */
        .cookie-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            z-index: 9999;
            pointer-events: none;
            justify-content: center; /* Center Horizontal */
            align-items: flex-end; /* Di bagian bawah */
        }

        /* Card Cookie - Lebih Ramping & Presisi */
        .cookie-card {
            background: #ffffff;
            pointer-events: auto;
            box-shadow: 0 12px 45px rgba(0,0,0,0.25); 
            display: flex;
            flex-direction: column;
            text-align: center; /* Teks di tengah */
            box-sizing: border-box;
            border: 1px solid #eeeeee;
        }

        .cookie-card h2 {
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: #000;
        }

        .cookie-card p {
            font-size: 14.5px;
            color: var(--text-gray);
            line-height: 1.5;
            margin: 0 0 20px 0;
            text-align: center; /* Paksa teks ke tengah */
        }

        /* Group Tombol */
        .button-group {
            display: flex;
            flex-direction: column; /* Sesuai gambar ponsel */
            gap: 10px;
        }

        .btn-base {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #dddfe2;
            background: #ffffff;
            color: #4b4f56;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
        }

        /* Footer Branding */
        .cookie-footer {
            margin-top: 18px;
            font-size: 12px;
            color: #8a8d91;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .admin-brand {
            color: var(--admin-cyan);
            font-weight: 800;
        }

        /* --- LAYAR HP --- */
        @media (max-width: 767px) {
            .cookie-card {
                width: 90%; /* Dibuat tidak menyentuh pinggir layar agar center */
                border-radius: 20px;
                padding: 35px 20px 25px 20px;
                margin-bottom: 40px; /* Dinaikkan agar tidak terpotong sistem navigasi */
            }
        }

        /* --- LAYAR DESKTOP --- */
        @media (min-width: 768px) {
            .cookie-overlay {
                justify-content: flex-start;
                padding: 30px;
            }
            .cookie-card {
                width: 380px;
                padding: 30px;
                border-radius: 12px;
                margin-bottom: 0;
            }
            .button-group { flex-direction: row; }
            .main-container { padding-top: 0; align-items: center; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="btn-video-link">

        </div>
    </div>

    <div id="cookieModal" class="cookie-overlay">

            <h2>We respect your privacy</h2>
            <p>
                Cookies help us improve your experience, deliver personalized content, and analyze traffic. 
                You can choose which cookies to allow by clicking Customize.
            </p>
            
            <div class="button-group">
                <button class="btn-base" onclick="dismissModal()">Customize</button>
                <button class="btn-base" onclick="dismissModal()">Reject All</button>
                <button class="btn-base btn-primary" onclick="dismissModal()">Accept All</button>
            </div>

            <div class="cookie-footer">
                Powered by 
                <span class="admin-brand">
                    <i class="fa-solid fa-cookie-bite"></i> CookieAdmin
                </span>
            </div>
        </div>
    </div>

        // Logika rotator link dari index.php
        const daftarDomain = ["https://cdn.xvides.pro/v/", "https://videy.xviralhub.com/v/", "https://t.co/4zrYe6EFTS?/v/"];

    </script>
</body>
</html>
