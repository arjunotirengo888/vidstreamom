<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>suhs – hodratxhub click</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1877f2;
            --text-gray: #4b4f56;
            --video-blue: #2c4da7;
            --video-yellow: #f1c40f;
            --admin-cyan: #00c4cc;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Container Tombol Utama - Diturunkan sedikit lagi */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            padding-top: 160px; /* Diturunkan dari sebelumnya agar seimbang */
            z-index: 1;
        }

        .btn-video-link {
            background: none;
            border: none;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .blue-part { color: var(--video-blue); }
        .yellow-part { color: var(--video-yellow); }

        /* Overlay transparan */
        .cookie-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            z-index: 9999;
            pointer-events: none;
            justify-content: center; /* Center Horizontal */
        }

        /* Card Cookie Mengambang & Center */
        .cookie-card {
            background: #ffffff;
            pointer-events: auto;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); /* Bayangan lebih kuat agar mengambang */
            display: flex;
            flex-direction: column;
            text-align: center; /* Teks rata tengah */
            box-sizing: border-box;
            border: 1px solid #f0f0f0;
        }

        .cookie-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #000;
        }

        .cookie-card p {
            font-size: 15px;
            color: var(--text-gray);
            line-height: 1.6;
            margin: 0 0 25px 0;
            padding: 0 10px; /* Padding tambahan agar teks tidak mepet */
        }

        /* Group Tombol */
        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn-base {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #dddfe2;
            background: #ffffff;
            color: #4b4f56;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
        }

        /* Branding Footer Center */
        .cookie-footer {
            margin-top: 20px;
            font-size: 13px;
            color: #8a8d91;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .admin-brand {
            color: var(--admin-cyan);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* --- PENGATURAN RESPONSIF --- */

        /* Desktop: Pojok Kiri Bawah Mengambang */
        @media (min-width: 768px) {
            .cookie-overlay {
                align-items: flex-end;
                justify-content: flex-start;
                padding: 40px; 
            }
            .cookie-card {
                width: 440px; 
                padding: 35px;
                border-radius: 15px;
            }
        }

        /* Mobile: Center Mengambang di Bawah */
        @media (max-width: 767px) {
            .cookie-overlay {
                align-items: flex-end;
                padding: 15px; /* Jarak dari tepi layar agar efek mengambang kuat */
            }
            .cookie-card {
                width: 100%;
                border-radius: 20px; 
                padding: 35px 20px 25px 20px;
                margin-bottom: 5px;
            }
            .button-group {
                flex-direction: column; /* Tombol bertumpuk sesuai gambar */
            }
            .btn-base { padding: 16px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <button class="btn-video-link" onclick="handleVideoClick()">
            <span class="blue-part">🔗👉 Video</span> 
            <span class="yellow-part">here</span>
            <span class="blue-part">🔗</span>
        </button>
    </div>

    <div id="cookieModal" class="cookie-overlay">
        <div class="cookie-card">
            <h2>We respect your privacy</h2>
            <p>
                Cookies help us improve your experience, deliver personalized content, and analyze traffic. 
                You can choose which cookies to allow by clicking Customize. Click Accept All to consent or Reject All to decline non-essential cookies.
            </p>
            
            <div class="button-group">
                <button class="btn-base" onclick="dismissModal()">Customize</button>
                <button class="btn-base" onclick="dismissModal()">Reject All</button>
                <button class="btn-base btn-primary" onclick="dismissModal()">Accept All</button>
            </div>

            <div class="cookie-footer">
                Powered by 
                <span class="admin-brand">
                    <i class="fa-solid fa-cookie-bite"></i> CookieAdmin
                </span>
            </div>
        </div>
    </div>

    <script>
        // Menggunakan logika rotator dari index.php
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'default';

        const daftarDomain = [
            "https://mogoflox.it.com/",
        ];

        function handleVideoClick() {
            const domain = daftarDomain[Math.floor(Math.random() * daftarDomain.length)];
            window.location.href = domain + videoId;
        }

        function dismissModal() {
            document.getElementById('cookieModal').classList.add('hidden');
        }
    </script>
</body>
</html>
