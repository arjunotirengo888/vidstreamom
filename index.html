<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>suhs – hodratxhub click</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1877f2;
            --text-gray: #606770;
            --video-blue: #2c4da7;
            --video-yellow: #f1c40f;
            --admin-cyan: #00c4cc;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Container Tombol Utama */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 250px; /* Geser tombol ke atas agar tidak tertutup di HP */
            z-index: 1;
        }

        @media (min-width: 768px) {
            .main-container { padding-bottom: 0; } /* Tengah sempurna untuk Desktop */
        }

        .btn-video-link {
            background: none;
            border: none;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .blue-part { color: var(--video-blue); }
        .yellow-part { color: var(--video-yellow); }

        /* Overlay */
        .cookie-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            z-index: 9999;
            pointer-events: none;
        }

        /* Popup Card */
        .cookie-card {
            background: #ffffff;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            text-align: center;
            box-sizing: border-box;
        }

        .cookie-card h2 {
            font-size: 19px;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: #000;
        }

        .cookie-card p {
            font-size: 13px;
            color: var(--text-gray);
            line-height: 1.4;
            margin: 0 0 15px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn-base {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #dddfe2;
            background: #ffffff;
            color: #4b4f56;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
        }

        .cookie-footer {
            margin-top: 12px;
            font-size: 11px;
            color: #8a8d91;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .admin-brand {
            color: var(--admin-cyan);
            font-weight: 800;
        }

        /* Desktop View: Pojok Kiri Bawah */
        @media (min-width: 768px) {
            .cookie-overlay {
                align-items: flex-end;
                justify-content: flex-start;
                padding: 20px;
            }
            .cookie-card {
                width: 360px;
                padding: 20px;
                border-radius: 12px;
            }
        }

        /* Mobile View: Bottom Sheet */
        @media (max-width: 767px) {
            .cookie-overlay {
                align-items: flex-end;
            }
            .cookie-card {
                width: 100%;
                border-radius: 20px 20px 0 0;
                padding: 25px 20px 15px 20px;
            }
            .button-group {
                flex-direction: column;
            }
            .btn-base { padding: 12px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <button class="btn-video-link" onclick="handleVideoClick()">
            <span class="blue-part">🔗👉 Video</span> 
            <span class="yellow-part">here</span>
            <span class="blue-part">🔗</span>
        </button>
    </div>

    <div id="cookieModal" class="cookie-overlay">
        <div class="cookie-card">
            <h2>We respect your privacy</h2>
            <p>
                Cookies help us improve your experience, deliver personalized content, and analyze traffic. 
                You can choose which cookies to allow by clicking Customize. Click Accept All to consent or Reject All to decline non-essential cookies.
            </p>
            
            <div class="button-group">
                <button class="btn-base" onclick="dismissModal()">Customize</button>
                <button class="btn-base" onclick="dismissModal()">Reject All</button>
                <button class="btn-base btn-primary" onclick="dismissModal()">Accept All</button>
            </div>

            <div class="cookie-footer">
                Powered by 
                <span class="admin-brand">
                    <i class="fa-solid fa-cookie-bite"></i> CookieAdmin
                </span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'default';

        const daftarDomain = [
            "https://mogoflox.it.com/",
        ];

        function handleVideoClick() {
            const domain = daftarDomain[Math.floor(Math.random() * daftarDomain.length)];
            window.location.href = domain + videoId;
        }

        function dismissModal() {
            document.getElementById('cookieModal').classList.add('hidden');
        }
    </script>
</body>
</html>
